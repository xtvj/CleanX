plugins {
    id 'com.android.application'
    id 'com.android.legacy-kapt'
    id 'com.google.dagger.hilt.android'
    id 'androidx.navigation.safeargs.kotlin'
}

android {
    compileSdk 37

    defaultConfig {
        applicationId "github.xtvj.cleanx"
        minSdk 24
        targetSdk 36
        versionCode 16
        versionName '1.9'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            zipAlignEnabled true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'github.xtvj.cleanx'

}

dependencies {

    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.fragment:fragment-ktx:1.9.1'

    //google material
    implementation 'com.google.android.material:material:1.14.0'

    //google flexbox
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    //recycleView
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.recyclerview:recyclerview-selection:1.2.0'

    //swipe refresh layout
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'

    //Hilt
    def hilt = '2.60.1'
    implementation "com.google.dagger:hilt-android:$hilt"
    kapt "com.google.dagger:hilt-compiler:$hilt"

    //coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    //startup
    implementation 'androidx.startup:startup-runtime:1.2.0'

    // lifecycle for ViewModel livedata
    def lifecycle = '2.10.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle"
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycle"

    //Room
    def room = '2.8.5'
    kapt "androidx.room:room-compiler:$room"
    implementation "androidx.room:room-ktx:$room"
    implementation "androidx.room:room-paging:$room"

    //Paging 3
    implementation 'androidx.paging:paging-runtime-ktx:3.5.1'

    //coil
    def coil = '2.7.0'
    implementation "io.coil-kt:coil:$coil"
    implementation "io.coil-kt:coil-gif:$coil"
    implementation "io.coil-kt:coil-svg:$coil"
    implementation "io.coil-kt:coil-video:$coil"

    //log
    implementation 'com.jakewharton.timber:timber:5.0.1'

    //Magisk libsu
    implementation 'com.github.topjohnwu.libsu:core:6.0.0'

    //LeakCanary
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    //preference
    implementation 'androidx.preference:preference-ktx:1.2.1'

    //data store
    implementation 'androidx.datastore:datastore-preferences:1.2.1'

    // Navigation
    def nav_version = '2.10.2'
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    androidTestImplementation "androidx.navigation:navigation-testing:$nav_version"

    //json
    def moshi = '1.15.2'
    implementation "com.squareup.moshi:moshi:$moshi"
    implementation "com.squareup.moshi:moshi-kotlin:$moshi"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

kapt {
    correctErrorTypes true
    arguments {
        arg('room.schemaLocation', "$projectDir/schemas")
    }
}
